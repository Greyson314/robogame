<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Actions &amp; name field — Robogame Design System</title>
<link href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Averia Libre",serif;color:#E8E1D2;
    background:radial-gradient(120% 130% at 50% 38%, #1B1712, #131009);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:32px}
  .caption{font-family:"Space Mono",monospace;font-style:italic;font-size:12px;
    color:rgba(232,225,210,0.4)}
  .name{width:300px;max-width:100%;background:rgba(0,0,0,0.35);
    border:1px solid rgba(0,0,0,0.6);border-top-color:rgba(0,0,0,0.75);
    border-bottom-color:rgba(232,225,210,0.1);
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.5);
    color:#E8E1D2;font-family:inherit;font-size:19px;padding:7px 12px;outline:none}
  .rowset{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
  .save{background:#E8E1D2;color:#26211A;font-family:inherit;font-size:17px;
    padding:10px 26px;border:0;cursor:pointer;
    border-radius:46% 54% 51% 49% / 62% 55% 45% 38%;
    box-shadow:0 5px 14px rgba(0,0,0,0.5);transition:all .15s}
  .save:hover{transform:translateY(2px);color:#14100C;
    box-shadow:0 2px 6px rgba(0,0,0,0.5), 0 0 14px #7FDCC8AA}
  .del{background:none;border:0;font-family:inherit;font-size:16px;
    color:rgba(232,225,210,0.6);cursor:pointer;transition:color .15s}
  .del:hover,.del.armed{color:#E8E1D2;text-decoration:line-through;
    text-decoration-color:#C33D1F;text-decoration-thickness:2.5px}
  .close{background:transparent;border:1px solid rgba(232,225,210,0.35);
    color:#E8E1D2;font-family:inherit;font-size:15px;padding:5px 16px;cursor:pointer;transition:all .15s}
  .close:hover{border-color:#7FDCC8;color:#7FDCC8}
</style>
</head>
<body>
  <div>
    <div class="caption">sunken name field — two-way bound to the selected row</div>
    <input class="name" value="Standard Mixture" spellcheck="false">
  </div>
  <div class="rowset">
    <button class="save">Save</button>
    <button class="del">Delete</button>
    <button class="del armed">Delete</button>
    <button class="close">Close</button>
  </div>
  <div class="caption">save = bone brushstroke blob, depresses + galvanic glow on hover ·
    delete arms into the vermilion strike-through (two-click) · close hovers galvanic</div>
</body>
</html>
