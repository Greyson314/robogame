<!-- @dsCard group="Laboratory" name="Concoctions list (recessed well)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concoctions list — Robogame Design System</title>
<link href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Averia Libre",serif;color:#E8E1D2;
    background:radial-gradient(120% 130% at 50% 38%, #1B1712, #131009);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  .well{width:260px;border:1px solid rgba(0,0,0,0.55);border-bottom-color:rgba(232,225,210,0.08);
    background:rgba(0,0,0,0.28);
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.55), inset 0 -1px 0 rgba(232,225,210,0.05)}
  h2{font-size:16px;font-weight:400;padding:10px 12px 6px;color:rgba(232,225,210,0.75)}
  .row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:12px;
    background:transparent;border:0;border-bottom:1px solid rgba(232,225,210,0.12);
    color:rgba(232,225,210,0.65);font-family:inherit;font-size:15px;cursor:pointer;transition:background .15s}
  .row:hover{background:rgba(74,110,126,0.18)}
  .row.sel{background:rgba(74,110,126,0.32);color:#E8E1D2}
  .plus{width:14px;height:14px;position:relative;flex:0 0 auto}
  .plus::before,.plus::after{content:"";position:absolute;background:#E8E1D2}
  .plus::before{left:6px;top:0;width:2px;height:14px}
  .plus::after{top:6px;left:0;width:14px;height:2px}
  .swatch{width:15px;height:19px;border-radius:3px 3px 5px 5px;flex:0 0 auto;
    border:1px solid rgba(232,225,210,0.4);position:relative}
  .swatch::before{content:"";position:absolute;top:-4px;left:4px;width:5px;height:4px;
    background:linear-gradient(180deg,#D8B36A,#8A6B33);border-radius:1px}
  .row.sel .swatch{box-shadow:0 0 8px 1px hsla(170,75%,60%,0.55)}
  .batch{margin-left:auto;font-family:"Space Mono",monospace;font-style:italic;
    font-size:12px;color:rgba(232,225,210,0.4)}
</style>
</head>
<body>
<div class="well">
  <h2>Concoctions</h2>
  <button class="row"><span class="plus"></span> New Concoction</button>
  <button class="row sel"><span class="swatch" style="background:hsl(170,62%,52%)"></span>
    Standard Mixture <span class="batch">no. 7</span></button>
  <button class="row"><span class="swatch" style="background:hsl(18,45%,42%)"></span>
    Pepper Fog <span class="batch">no. 12</span></button>
  <button class="row"><span class="swatch" style="background:hsl(262,45%,42%)"></span>
    Slow Jam <span class="batch">no. 3</span></button>
</div>
</body>
</html>
